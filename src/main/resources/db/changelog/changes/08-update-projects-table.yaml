databaseChangeLog:
  - changeSet:
      id: update-projects-table
      author: ChorniyPistolet
      changes:
        - addColumn:
            tableName: projects
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: projects
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_projects_user
            onDelete: CASCADE