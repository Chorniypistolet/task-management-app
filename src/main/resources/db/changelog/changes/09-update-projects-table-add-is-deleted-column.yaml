databaseChangeLog:
  - changeSet:
      id: update-projects-table-add-is-deleted-column
      author: ChorniyPistolet
      changes:
        - addColumn:
            tableName: projects
            columns:
              - column:
                  name: is_deleted
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false